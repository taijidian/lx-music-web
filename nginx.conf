server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 自研前端接管首页与原播放器路径（no-cache 保证浏览器每次都校验新版，避免旧缓存页面）
    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location = /music { try_files /index.html =404; add_header Cache-Control "no-cache"; }

    # 家庭多账号：注册与账号列表走内部小服务（管理员口令不经过浏览器）
    location = /api/register {
        proxy_pass http://lx-register:8080/register;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location = /api/family-users {
        proxy_pass http://lx-register:8080/users;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location = /api/favpls {
        proxy_pass http://lx-register:8080/favpls;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # PWA 资源（nginx 直接托管，不走后端）
    location = /sw.js { try_files $uri =404; add_header Cache-Control "no-cache"; }
    location = /manifest.json { try_files $uri =404; }
    location /icons/ { try_files $uri =404; }

    location /api/ {
        proxy_pass http://lx-sync-server:9527;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 其余路径（LX 客户端同步协议、管理后台 /admin 等）透传给后端
    location / {
        proxy_pass http://lx-sync-server:9527;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# 域名 http 入口（宿主机 80 -> 容器 8080）：除证书续期验证外，一律跳转 https
server {
    listen 8080;
    server_name music.example.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://music.example.com$request_uri; }
}

# HTTPS 主站：与 9527 的 http 服务同一套应用与接口
server {
    listen 443 ssl;
    server_name music.example.com;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;

    # 自研前端接管首页与原播放器路径（no-cache 保证浏览器每次都校验新版，避免旧缓存页面）
