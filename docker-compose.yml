services:
  lx-web:
    image: nginx:alpine
    container_name: lx-web
    restart: unless-stopped
    ports:
      - "9527:80"
      - "443:443"
      - "80:8080"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./manifest.json:/usr/share/nginx/html/manifest.json:ro
      - ./sw.js:/usr/share/nginx/html/sw.js:ro
      - ./icons:/usr/share/nginx/html/icons:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./acme-webroot:/var/www/acme:ro
    networks:
      - lxmusic

  lx-register:
    image: python:3-alpine
    container_name: lx-register
    restart: unless-stopped
    command: python3 /app/register_server.py
    volumes:
      - ./register_server.py:/app/register_server.py:ro
      - ./favpls-data:/data
      - ./secrets/credentials.env:/secrets/credentials.env:ro
    networks:
      - lxmusic

networks:
  lxmusic:
    external: true
    name: lx-music_default
